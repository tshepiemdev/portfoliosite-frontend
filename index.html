<!doctype html>
<html lang="en" style="scroll-behavior: smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      @font-face {
        font-family: "interFont";
        src: url("/fonts/Inter-VariableFont_opsz,wght.ttf") format("truetype");
        font-optical-sizing: auto;
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "hostGroteskFont";
        src: url("/fonts/HostGrotesk-VariableFont_wght.ttf") format("truetype");
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "instrumentSerifFont";
        src: url("/fonts/InstrumentSerif-Regular.ttf") format("truetype");
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      html.modal-open,
      body.modal-open {
        overflow: hidden !important;
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }

      html.modal-open::-webkit-scrollbar,
      body.modal-open::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }

      body.modal-open {
        height: 100dvh !important;
        overscroll-behavior: none;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-width: 100%;
        min-height: 100%;
        background-color: #000000;
      }

      body {
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        width: 100%;
        background-color: #000000;
      }

      #modal-root {
        position: relative;
        z-index: 99998;
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        opacity: 1;
        visibility: visible;
        pointer-events: all;
        transition:
          opacity 0.25s ease,
          visibility 0.25s ease;
      }

      #initial-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #initial-loader .loadingCircle {
        width: 4rem;
        height: 4rem;
        box-sizing: border-box;
        background: transparent;
        border: 6px solid #1a1a1a;
        border-top: 6px solid #ffffff;
        border-radius: 90rem;
        animation: initialLoaderSpin 0.8s linear infinite;
      }

      @keyframes initialLoaderSpin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <div id="modal-root"></div>

    <div id="initial-loader" aria-hidden="true">
      <div class="loadingCircle"></div>
    </div>

    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
