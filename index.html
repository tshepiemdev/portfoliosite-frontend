    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,1432,100900;1,1432,100900&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap");

      @font-face {
        font-family: "interFont";
        src: url("/fonts/Inter-VariableFont_opsz,wght.ttf") format("truetype");
        font-optical-sizing: auto;
        font-weight: 100 900;

      }

      @font-face {
        font-family: "hostGroteskFont";
        src: url("/fonts/HostGrotesk-VariableFont_wght.ttf") format("truetype");
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
      }

      @font-face {
        font-family: "instrumentSerifFont";
        src: url("/fonts/InstrumentSerif-Regular.ttf") format("truetype");
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
      }

      body.modal-open {
        overflow: hidden;
        height: 100%;
      }

      body {
        margin: 0;
        background-color: #000000;
      }

      #root {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #000000;
      }

      .loaderView {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        transition: all 0.3s ease-in-out;
      }

      .loadingCircle {
        background-color: transparent;
        border: 8px solid #1a1a1a;
        border-top: 8px solid #ffffff;
        border-radius: 16rem;
        width: 3rem;
        aspect-ratio: 1 / 1;
        animation: spin 1.4s infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="loaderView">
        <div class="loadingCircle"></div>
      </div>
    </div>

    <div id="modal-root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
