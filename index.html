<!doctype html>
<html lang="en" style="scroll-behavior: smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tshepiem.dev</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,1432,100900;1,1432,100900&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap");

      @font-face {
        font-family: interFont;
        src: url("../assets/fonts/Inter-VariableFont_opsz,wght.ttf");
      }

      @font-face {
        font-family: bricolageFont;
        src: url("../assets/fonts/BricolageGrotesqueRegular.otf");
      }

      @font-face {
        font-family: instrumentSerifFont;
        src: url("../assets/fonts/InstrumentSerif-Regular.ttf");
      }

      body.modal-open {
        overflow: hidden;
        height: 100%;
      }

      body {
        margin: 0;
        background-color: #000000;
      }

      #root {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #000000;
      }

      .loaderView {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        transition: all 0.3s ease-in-out;
      }

      .loadingCircle {
        background-color: transparent;
        border: 6px solid #1a1a1a;
        border-top: 6px solid #ffffff;
        border-radius: 16rem;
        width: 3rem;
        aspect-ratio: 1 / 1;
        animation: spin 1.4s infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .loaderText {
        color: whitesmoke;
        font-size: 1rem;
        font-family:
          "Bricolage Grotesque", bricolageFont, "Inter", interFont, sans-serif;
        font-optical-sizing: auto;
        font-weight: 550;
        font-style: normal;
        text-align: center;

        display: none;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="loaderView">
        <div class="loadingCircle"></div>
        <p class="loaderText">
          Hang tight, getting
          <br />things ready for you
        </p>
      </div>
    </div>

    <div id="modal-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
